name: kerjapraktek
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  image_picker: ^1.0.7 
  intl: ^0.19.0
  file_picker: ^8.0.0
  excel: ^4.0.3
  cupertino_icons: ^1.0.8 
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  windows:
    generate: true
    image_path: "assets/icon.png"

flutter:
  uses-material-design: true